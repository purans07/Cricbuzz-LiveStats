name: Refresh public cricket data
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: provider-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - name: Fetch and validate one provider response
        env:
          CRICBUZZ_API_KEY: ${{ secrets.CRICBUZZ_API_KEY }}
          CRICBUZZ_CONTRACT_FILE: api/contracts/cricketapilive_v2.json
        run: python -m deployment.public_provider
      - name: Publish validated sporting records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public_provider/90-latest-matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public cricket snapshot'
            git push
          fi
